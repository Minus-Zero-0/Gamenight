<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Game Night</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0f1020;--card:#191b34;--tx:#f2f1ff;--mu:#9a9cc4;--ac:#ff5c8a;--ac2:#7c5cff;--ok:#3ddc97;--fld:#0b0c1a;--bd:#6a6ea8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f3ff;--card:#fff;--tx:#1a1a33;--mu:#6a6c90;--fld:#eceeff;--bd:#7a7fb8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;margin:.2em 0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:.2em 0 .6em}.mu{color:var(--mu)}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.game{border:1px solid #ffffff14;border-radius:14px;padding:14px;background:var(--card)}
.game b{display:block;margin-bottom:4px}.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:#ffffff14;color:var(--mu)}
.tag.live{background:var(--ok);color:#06281a}
button,input,select{font:inherit;border-radius:12px;border:1.5px solid var(--bd);padding:10px 14px;background:var(--fld);color:var(--tx)}
button{cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac2));border:0;color:#fff;font-weight:600;margin:3px}
button.alt{background:var(--fld);border:1.5px solid var(--bd);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}input::placeholder{color:var(--mu);opacity:1}
.fw input,.fw select{display:block;width:100%;margin:6px 0}
button:disabled{opacity:.4}
.chips span{display:inline-block;margin:3px;padding:6px 12px;border-radius:99px;background:#ffffff14}
.chips span.done{background:var(--ok);color:#06281a}
.prompt{font-size:1.3rem;padding:18px;border-radius:14px;background:linear-gradient(135deg,#ff5c8a33,#7c5cff33);margin:10px 0}
.code{font-size:1.6rem;letter-spacing:.3em;font-weight:800}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #ffffff14}
.big{font-size:1.1rem}
.chat{max-height:200px;overflow-y:auto;padding:8px;border-radius:12px;background:#ffffff0d;margin-bottom:8px}
.chat div{margin:4px 0;word-break:break-word}.chat b{color:var(--ac)}.chat b.me{color:var(--ok)}
.send{display:flex;gap:6px}.send input{flex:1;min-width:0}
.ann{background:#7c5cff33;border-left:3px solid var(--ac);padding:6px 8px;border-radius:8px}
.plea{padding:10px 12px;margin:6px 0;border-radius:12px;background:#ffffff0d}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;color:#fff;font-weight:700;font-size:.8rem;vertical-align:middle;flex:none}
.pfps{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:320px;overflow-y:auto;margin:8px 0}
.pf{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:var(--fld);border:1.5px solid var(--bd);color:var(--tx);margin:0;font-weight:400;position:relative}
.pf small{font-size:.68rem;text-align:center;line-height:1.1}.pf.sel{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.pf:disabled{opacity:.35}.pf em{position:absolute;top:2px;right:4px;font-size:.6rem;font-style:normal;color:var(--ac)}
.me-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stage{display:flex;flex-direction:column;gap:8px;margin:12px 0;padding:10px;border-radius:18px;background:var(--card)}
.sr{display:flex;justify-content:space-evenly;align-items:flex-start;gap:6px}
.sm{display:flex;gap:8px;align-items:stretch}
.sc{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:6px;width:clamp(58px,17vw,96px);flex:none}
.sc:empty{display:none}
.sm .scr{flex:1;min-width:0}
.pc{width:clamp(58px,17vw,96px)}
.pc .av{width:clamp(34px,9vw,56px)!important;height:clamp(34px,9vw,56px)!important}
.pc button{margin:2px 0 0;padding:3px 9px;font-size:.7rem;border-radius:8px}
.lg2{position:absolute;top:8px;left:12px;font-size:.7rem;letter-spacing:.25em;opacity:.55}
.pc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;text-align:center;min-width:0}
.pc small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc.dd{opacity:.4;filter:grayscale(1)}
.scr{display:flex;align-items:center;justify-content:center;min-height:225px;padding:14px;border-radius:16px;text-align:center;background:radial-gradient(circle at 50% 30%,#3a1f5c,#120a1f 70%);color:#fff;box-shadow:inset 0 0 40px #000a,0 0 24px #7c5cff55;font-size:1.05rem;line-height:1.35}
.scr .fx{animation:fi .7s ease}@keyframes fi{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.lg{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:#000a;border:1.5px solid var(--bd);color:#fff;font-size:1.6rem}.lg b{font-size:.8rem;letter-spacing:.25em}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;margin:0;background:var(--fld);border:1.5px solid var(--bd);color:var(--tx)}
.tabs button.on{background:linear-gradient(90deg,var(--ac),var(--ac2));border:0;color:#fff}.tabs i{background:var(--ac);color:#fff;border-radius:99px;padding:0 6px;margin-left:6px;font-style:normal;font-size:.75rem}
@media(prefers-reduced-motion:reduce){.scr .fx{animation:none}}
.scr{flex-direction:column;gap:8px;overflow:hidden;position:relative}
.scr.night{background:linear-gradient(#000b,#000b),url(images/night.webp) center/cover}
.scr.day{background:linear-gradient(#0009,#0009),url(images/morning.webp) center/cover}
.fa{position:relative;width:64px;height:64px;flex:none}
.fl{animation:fling 5s ease-in both}
@keyframes fling{0%,12%{transform:none}100%{transform:translate(380px,-220px) rotate(1800deg) scale(.15)}}
.hf{position:absolute;inset:0;animation:5s ease-in both}
.hf.a{clip-path:polygon(0 0,100% 0,0 100%);animation-name:sa}
.hf.b{clip-path:polygon(100% 0,100% 100%,0 100%);animation-name:sb}
@keyframes sa{0%,30%{transform:none}100%{transform:translate(-50px,160px) rotate(-30deg);opacity:0}}
@keyframes sb{0%,30%{transform:none}100%{transform:translate(50px,190px) rotate(30deg);opacity:0}}
.sl{position:absolute;inset:-6px;background:linear-gradient(to top left,transparent 47%,#fff 48.5%,#fff 51.5%,transparent 53%);opacity:0;animation:sl 5s linear both}
@keyframes sl{0%,29%{opacity:0}30%{opacity:1}42%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.fl,.hf,.sl{animation:none}}
</style></head><body><main id="app"></main>

 const okp=cu(sf.pf)||GEN(sf.pf);
